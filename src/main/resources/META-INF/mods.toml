modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

# 匠魂是硬依赖：狼铠的部件/材料体系与长矛的匠魂工具定义都建立在它上面，
# 没有它这个模组没有意义（宁可启动时明确报缺，也不要静默半残）。
[[dependencies.${mod_id}]]
modId="tconstruct"
mandatory=true
versionRange="${tconstruct_version_range}"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="mantle"
mandatory=true
versionRange="${mantle_version_range}"
ordering="AFTER"
side="BOTH"

# 客户端动画（压低 / 戳刺）：1.20.1 没有物品动画接口，只能 mixin 手部渲染
[[mixins]]
config="futuretinker.mixins.json"
