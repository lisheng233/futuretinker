plugins {
    id 'net.minecraftforge.gradle' version '6.0.54'
    id 'eclipse'
    id 'idea'
}

def modId = 'futuretinker'

version = mod_version
group = mod_group_id
base {
    archivesName = modId
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods { "${modId}" { source sourceSets.main } }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            args '--nogui'
            mods { "${modId}" { source sourceSets.main } }
        }
        data {
            workingDirectory project.file('run')
            args '--mod', modId, '--all',
                 '--output', file('src/generated/resources/'),
                 '--existing', file('src/main/resources/')
            mods { "${modId}" { source sourceSets.main } }
        }
        // 判定用的服务端：跑完全部 GameTest 后自己退出，退出码 = 失败的必需测试数。
        gameTestServer {
            workingDirectory project.file('run')
            // 只注册这个命名空间下的测试（名字必须和 @GameTest(templateNamespace = ...) 一致）。
            property 'forge.enabledGameTestNamespaces', modId
            property 'forge.logging.markers', ''
            property 'forge.logging.console.level', 'debug'
            jvmArgs '-Xmx2G'
            // 故障注入：`gradlew runGameTestServer -PftFault` 让一条必需测试故意失败，
            // 用来证明判定真的会说「不」。不带这个参数时行为完全正常。
            if (project.hasProperty('ftFault')) {
                property 'futuretinker.selftest.fault', 'true'
            }
            mods { "${modId}" { source sourceSets.main } }
        }
        configureEach {
            // ★ dev 运行期必须开 Mixin refmap 重映射。
            //   libs/ 里那些模组的 jar 是**生产 reobf 版**：方法名是 SRG（m_142467_），
            //   而 dev 环境是 official 名（setRemoved）。不重映射就会在启动时抛
            //     InvalidInjectionException: could not find any targets matching '...m_142467_...'
            //   并把整个 dev 运行打挂。只影响本地运行，不影响产物 jar。
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
        }
    }
}

repositories {
    mavenCentral()
    // ForgeGradle 只对「仓库解析出来的依赖」做重映射；用 files(...) 依赖会打
    // "Cannot deobfuscate ... using obfuscated version!" 并**静默使用混淆版**，
    // 于是 dev 运行时找不到 SRG 目标而崩。所以 libs/ 下的模组 jar 必须走 flatDir 仓库解析。
    flatDir { dirs 'libs' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf("slimeknights.tconstruct:TConstruct:1.20.1-3.12.1.236")
    implementation fg.deobf("slimeknights.mantle:Mantle:1.20.1-1.11.122")
}

// mods.toml / pack.mcmeta 里的 ${mod_id} 等由 Gradle expand 替换。
def replaceProperties = [
    minecraft_version      : minecraft_version,
    minecraft_version_range: minecraft_version_range,
    forge_version          : forge_version,
    forge_version_range    : forge_version_range,
    loader_version_range   : loader_version_range,
    mod_id                 : mod_id,
    mod_name               : mod_name,
    mod_license            : mod_license,
    mod_version            : mod_version,
    mod_authors            : mod_authors,
    mod_description        : mod_description,
    tconstruct_version_range: tconstruct_version_range,
    mantle_version_range   : mantle_version_range,
]

// ★ gradle.properties 会被 Gradle 按 ISO-8859-1 读取（实测：中文 '用' 进来是码点 231 的 'ç'），
//   于是带中文的值在 expand 之后会变成双编码的乱码（mods.toml 里显示 "ç¨å..."）。
//   含非 ASCII 的项在这里按 UTF-8 从同一个文件重新取一次，保持「只有一份配置」。
def readPropertyUtf8 = { String key ->
    def prefix = key + '='
    def line = file('gradle.properties').getText('UTF-8').readLines().find { it.startsWith(prefix) }
    line == null ? null : line.substring(prefix.length()).trim()
}
replaceProperties.mod_description = readPropertyUtf8('mod_description')

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    inputs.properties replaceProperties
    // 读模板与写产物都用 UTF-8（默认跟随 JVM 的 file.encoding，换台机器就可能变）。
    filteringCharset = 'UTF-8'
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) { expand replaceProperties }
}

jar {
    manifest {
        attributes([
            "Specification-Title"     : modId,
            "Specification-Vendor"    : mod_authors,
            "Specification-Version"   : "1",
            "Implementation-Title"    : mod_name,
            "Implementation-Version"  : project.version,
            "Implementation-Vendor"   : mod_authors,
        ])
    }
    finalizedBy 'reobfJar'
}

// ── GameTest 运行目录：可复现，不依赖谁手工往 run/ 里丢过文件 ──────────────────
// 注意：不能写 tasks.named('runGameTestServer')——ForgeGradle 是在
// `minecraft { runs { ... } }` 之后才创建这些任务的，named 会在配置阶段就失败。
tasks.register('stageGameTestStructures', Copy) {
    from 'gameteststructures'
    into 'run/gameteststructures'
}

tasks.register('acceptEula') {
    def eula = file('run/eula.txt')
    outputs.file eula
    doLast {
        eula.parentFile.mkdirs()
        eula.text = 'eula=true\n'
    }
}

tasks.matching { it.name == 'runGameTestServer' || it.name == 'runServer' }.configureEach {
    dependsOn 'stageGameTestStructures', 'acceptEula'
}

// 判定只看退出码，所以这里钉死「退出码非 0 = 任务失败」。
// （JavaExec 的默认值就是 false，写出来是为了让下一个人别把它改成 true 把证据抹掉。）
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    if (it instanceof JavaExec) {
        it.ignoreExitValue = false
    }
}
